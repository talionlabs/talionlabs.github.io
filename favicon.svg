<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background -->
  <rect width="64" height="64" fill="#000000" rx="8"/>

  <!-- T crossbar — bold horizontal lines, full width -->
  <rect x="6"  y="8"  width="52" height="4.5" rx="2.25" fill="white"/>
  <rect x="6"  y="15" width="52" height="4"   rx="2"    fill="white" opacity="0.88"/>
  <rect x="6"  y="21" width="52" height="3.5" rx="1.75" fill="white" opacity="0.74"/>
  <rect x="6"  y="27" width="52" height="3"   rx="1.5"  fill="white" opacity="0.60"/>

  <!-- T stem — centered lines, tapering width and opacity -->
  <rect x="22" y="33" width="20" height="3.5" rx="1.75" fill="white" opacity="0.88"/>
  <rect x="23" y="39" width="18" height="3"   rx="1.5"  fill="white" opacity="0.75"/>
  <rect x="24" y="44" width="16" height="2.8" rx="1.4"  fill="white" opacity="0.62"/>
  <rect x="25" y="49" width="14" height="2.5" rx="1.25" fill="white" opacity="0.50"/>
  <rect x="26" y="54" width="12" height="2"   rx="1"    fill="white" opacity="0.35"/>

  <!-- Red pulse spike — glow layer -->
  <path d="M30.5 33 L31.2 24 L32 11 L32.8 24 L33.5 33" stroke="#ff2a4a" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  <!-- Red pulse spike — main sharp line -->
  <path d="M30.5 33 L31.2 24 L32 11 L32.8 24 L33.5 33" stroke="#ff2a4a" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Red base bar -->
  <rect x="27" y="32" width="10" height="2.8" rx="1.4" fill="#ff2a4a"/>
  <!-- Base glow -->
  <rect x="24" y="31" width="16" height="5" rx="2.5" fill="#ff2a4a" opacity="0.18"/>
</svg>
